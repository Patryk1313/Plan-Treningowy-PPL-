<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trening Kalendarz</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; text-align: center; padding: 40px 20px; background: #000; color: #fff; }
        .card { background: #1c1c1e; padding: 30px; border-radius: 20px; border: 1px solid #38383a; }
        h1 { color: #ff3b30; font-size: 24px; }
        .btn { display: inline-block; background: #ff3b30; color: #fff; padding: 15px 25px; border-radius: 12px; text-decoration: none; font-weight: bold; margin-top: 20px; border: none; font-size: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Plan Treningowy 4T</h1>
        <p>Jeśli Safari zapyta o pozwolenie, kliknij "Pozwól".</p>
        <button class="btn" onclick="downloadIcs()">📅 Pobierz Kalendarz</button>
    </div>

    <script>
        function downloadIcs() {
            const exercises = {
                "PUSH": "Wyciskanie plaska, Incline Smith, Rozpietki, Barki, Triceps",
                "PULL": "Podciaganie, Wioslowanie, Lat Pulldown, Face Pulls, Biceps",
                "LEGS": "Przysiady, RDL, Leg Press, Wyprosty, Uginania, Lydki, Brzuch"
            };

            let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Workout//PL\nMETHOD:PUBLISH\n";
            const startDate = new Date();
            const pattern = ["PUSH", "PULL", "OFF", "LEGS", "PUSH", "OFF", "PULL", "LEGS", "OFF", "PUSH", "PULL", "OFF", "LEGS", "PUSH", "OFF", "PULL"];
            
            for (let i = 0; i < 28; i++) {
                let dayType = pattern[i % pattern.length];
                if (dayType === "OFF") continue;

                let date = new Date();
                date.setDate(startDate.getDate() + i);
                let dateStr = date.toISOString().replace(/-|:|\.\d+/g, "").split("T")[0];

                icsContent += "BEGIN:VEVENT\n";
                icsContent += "DTSTART;VALUE=DATE:" + dateStr + "\n";
                icsContent += "SUMMARY:Trening " + dayType + "\n";
                icsContent += "DESCRIPTION:" + exercises[dayType] + "\n";
                icsContent += "END:VEVENT\n";
            }
            icsContent += "END:VCALENDAR";

            // Specjalne podejscie pod Safari
            const dataUri = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(icsContent);
            const link = document.createElement('a');
            link.setAttribute('href', dataUri);
            link.setAttribute('download', 'plan_treningowy.ics');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
